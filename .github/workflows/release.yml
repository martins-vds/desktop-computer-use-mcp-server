name: Release executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve semantic version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
    steps:
      - name: Validate and resolve release version
        id: version
        shell: bash
        env:
          CANDIDATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$CANDIDATE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use strict semantic version format vX.X.X; received '$CANDIDATE_TAG'." >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "release_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$version.0" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DesktopComputerUse.sln

      - name: Build
        run: dotnet build DesktopComputerUse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DesktopComputerUse.sln --configuration Release --no-build

  publish:
    name: Publish ${{ matrix.asset }}
    needs:
      - prepare
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            tfm: net8.0
            component: server
            binary: desktop-computer-use
            project: src/DesktopComputerUse.Server.Linux/DesktopComputerUse.Server.Linux.csproj
            asset: desktop-computer-use-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            tfm: net8.0
            component: server
            binary: desktop-computer-use
            project: src/DesktopComputerUse.Server.Linux/DesktopComputerUse.Server.Linux.csproj
            asset: desktop-computer-use-linux-arm64
          - os: windows-latest
            rid: win-x64
            tfm: net8.0-windows
            component: server
            binary: desktop-computer-use
            project: src/DesktopComputerUse.Server/DesktopComputerUse.Server.csproj
            asset: desktop-computer-use-windows-x64
          - os: windows-latest
            rid: win-arm64
            tfm: net8.0-windows
            component: server
            binary: desktop-computer-use
            project: src/DesktopComputerUse.Server/DesktopComputerUse.Server.csproj
            asset: desktop-computer-use-windows-arm64
          - os: windows-latest
            rid: win-x64
            tfm: net8.0-windows
            component: profile-builder
            binary: desktop-computer-use-profile-builder
            project: src/DesktopComputerUse.ProfileBuilder/DesktopComputerUse.ProfileBuilder.csproj
            asset: desktop-computer-use-profile-builder-windows-x64
          - os: windows-latest
            rid: win-arm64
            tfm: net8.0-windows
            component: profile-builder
            binary: desktop-computer-use-profile-builder
            project: src/DesktopComputerUse.ProfileBuilder/DesktopComputerUse.ProfileBuilder.csproj
            asset: desktop-computer-use-profile-builder-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore publish dependencies
        shell: bash
        run: dotnet restore "${{ matrix.project }}" --runtime "${{ matrix.rid }}"

      - name: Publish single-file executable
        shell: bash
        run: >-
          dotnet publish "${{ matrix.project }}"
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          --no-restore
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${{ needs.prepare.outputs.version }}"
          -p:PackageVersion="${{ needs.prepare.outputs.version }}"
          -p:AssemblyVersion="${{ needs.prepare.outputs.assembly_version }}"
          -p:FileVersion="${{ needs.prepare.outputs.assembly_version }}"
          -p:InformationalVersion="${{ needs.prepare.outputs.version }}"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:RepositoryCommit="$GITHUB_SHA"
          -p:ContinuousIntegrationBuild=true

      - name: Verify published assembly version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_ASSEMBLY_VERSION: ${{ needs.prepare.outputs.assembly_version }}
        run: |
          $projectDirectory = Split-Path "${{ matrix.project }}"
          $assembly = Join-Path $projectDirectory `
            "bin/Release/${{ matrix.tfm }}/${{ matrix.rid }}/${{ matrix.binary }}.dll"
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path $assembly)
          )
          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName(
            (Resolve-Path $assembly)
          )
          if ($assemblyName.Version.ToString() -ne $env:EXPECTED_ASSEMBLY_VERSION) {
            throw "Expected AssemblyVersion $env:EXPECTED_ASSEMBLY_VERSION, got $($assemblyName.Version)."
          }
          if ($versionInfo.FileVersion -ne $env:EXPECTED_ASSEMBLY_VERSION) {
            throw "Expected FileVersion $env:EXPECTED_ASSEMBLY_VERSION, got $($versionInfo.FileVersion)."
          }
          if ($versionInfo.ProductVersion -ne $env:EXPECTED_VERSION) {
            throw "Expected ProductVersion $env:EXPECTED_VERSION, got $($versionInfo.ProductVersion)."
          }

      - name: Stage release files
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ASSEMBLY_VERSION: ${{ needs.prepare.outputs.assembly_version }}
        run: |
          mkdir -p package/profiles
          cp README.md package/
          cp profiles/example.application.json package/profiles/
          if [[ -f publish/appsettings.json ]]; then
            cp publish/appsettings.json package/
          fi
          printf '%s\n' "$RELEASE_VERSION" > package/VERSION
          cat > package/release-manifest.json <<EOF
          {
            "tag": "$RELEASE_TAG",
            "version": "$RELEASE_VERSION",
            "assemblyVersion": "$ASSEMBLY_VERSION",
            "component": "${{ matrix.component }}",
            "runtimeIdentifier": "${{ matrix.rid }}",
            "commit": "$GITHUB_SHA"
          }
          EOF
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "publish/${{ matrix.binary }}.exe" package/
          else
            cp "publish/${{ matrix.binary }}" package/
            chmod +x "package/${{ matrix.binary }}"
          fi

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          tar -C package -czf
          "${{ matrix.asset }}-v${{ needs.prepare.outputs.version }}.tar.gz" .

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path package\*
          -DestinationPath "${{ matrix.asset }}-v${{ needs.prepare.outputs.version }}.zip"

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-v${{ needs.prepare.outputs.version }}
          path: ${{ matrix.asset }}-v${{ needs.prepare.outputs.version }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum desktop-computer-use-* > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Desktop Computer Use $RELEASE_TAG" \
              --generate-notes
          fi
